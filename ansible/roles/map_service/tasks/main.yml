---
# ==============================================================================
# Map Service Role - Task Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Data Setup (Worker 1 Only)
# ------------------------------------------------------------------------------
- name: Map Data Setup (Worker 1)
  block:
    - name: Create map service stack directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/docker/stacks/map_service
        - /opt/docker/stacks/map_service/data
        - /opt/docker/stacks/map_service/tiles

    - name: Copy setup script
      copy:
        src: setup_map_data.sh
        dest: /opt/docker/stacks/map_service/setup_map_data.sh
        mode: '0755'

    - name: Run map data setup script (This can take 10-30 minutes)
      shell: |
        set -e
        /opt/docker/stacks/map_service/setup_map_data.sh
        echo "Setup completed successfully"
      args:
        chdir: /opt/docker/stacks/map_service
      environment:
        SETUPDONE_FILE: "/opt/docker/stacks/map_service/data/.setup_done"
      register: map_setup_result
      async: 3600
      poll: 30
      changed_when: "'Setup completed successfully' in map_setup_result.stdout"

    - name: Verify Map Data Files
      stat:
        path: "{{ item }}"
      register: map_data_files
      failed_when: not map_data_files.stat.exists
      loop:
        - /opt/docker/stacks/map_service/data/combined-regions.osrm
        - /opt/docker/stacks/map_service/tiles/combined.mbtiles

  when: "inventory_hostname == groups['workers'][0]"

# ------------------------------------------------------------------------------
# 2. Deployment (Manager Only)
# ------------------------------------------------------------------------------
- name: Deploy Map Stack (Manager Only)
  block:
    - name: Create stack directory on manager
      file:
        path: /opt/docker/stacks/map_service
        state: directory
        mode: '0755'

    - name: Generate map service stack definition
      template:
        src: map_service_stack.yml.j2
        dest: /opt/docker/stacks/map_service/docker-compose.yml
        mode: '0644'

    - name: Deploy map service stack
      command: docker stack deploy --with-registry-auth -c /opt/docker/stacks/map_service/docker-compose.yml map
      register: map_deploy_result
      changed_when: "'Creating' in map_deploy_result.stdout or 'Updating' in map_deploy_result.stdout"

    - name: Wait for Map services to be healthy
      shell: |
        docker service ls --filter name=map_{{ item }} --format '{{ "{{" }}.Replicas{{ "}}" }}'
      register: map_status
      until: "map_status.stdout.split('/')[0] | int >= 1"
      retries: 60
      delay: 15
      loop:
        - osrm
        - martin
      changed_when: false

  when: "inventory_hostname == groups['managers'][0]"
